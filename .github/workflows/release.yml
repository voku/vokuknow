name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release assets (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            archive: tar.gz
            binary-ext: ''
          - goos: linux
            goarch: arm64
            archive: tar.gz
            binary-ext: ''
          - goos: darwin
            goarch: amd64
            archive: tar.gz
            binary-ext: ''
          - goos: darwin
            goarch: arm64
            archive: tar.gz
            binary-ext: ''
          - goos: windows
            goarch: amd64
            archive: zip
            binary-ext: '.exe'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          go build -trimpath -o "dist/vokuknow${{ matrix.binary-ext }}" ./cmd/vokuknow

      - name: Package archive
        run: |
          asset="vokuknow_${{ matrix.goos }}_${{ matrix.goarch }}.${{ matrix.archive }}"
          staging=$(mktemp -d)
          cp "dist/vokuknow${{ matrix.binary-ext }}" "$staging/vokuknow${{ matrix.binary-ext }}"

          if [ "${{ matrix.archive }}" = "zip" ]; then
            (
              cd "$staging"
              zip -q -r "$GITHUB_WORKSPACE/dist/$asset" .
            )
          else
            tar -C "$staging" -czf "$GITHUB_WORKSPACE/dist/$asset" .
          fi

      - name: Upload release asset
        uses: actions/upload-artifact@v4.6.2
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/vokuknow_${{ matrix.goos }}_${{ matrix.goarch }}.${{ matrix.archive }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4.3.0
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum vokuknow_* > checksums.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/vokuknow_*
            dist/checksums.txt
          generate_release_notes: true
