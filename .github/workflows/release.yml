name: Release

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release context
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    outputs:
      should-release: ${{ steps.tag.outputs.should-release }}
      release-tag: ${{ steps.tag.outputs.release-tag }}

    steps:
      - name: Resolve release tag
        id: tag
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const headSha = context.payload.workflow_run.head_sha;
            let releaseTag = null;
            let page = 1;

            while (!releaseTag) {
              const { data: tags } = await github.rest.repos.listTags({
                owner,
                repo,
                per_page: 100,
                page,
              });

              if (tags.length === 0) {
                break;
              }

              const match = tags.find((tag) => tag.name.startsWith('v') && tag.commit?.sha === headSha);
              if (match) {
                releaseTag = match.name;
                break;
              }

              if (tags.length < 100) {
                break;
              }

              page += 1;
            }

            if (!releaseTag) {
              core.info('No version tag found for commit; skipping release.');
              core.setOutput('should-release', 'false');
              return;
            }

            core.setOutput('should-release', 'true');
            core.setOutput('release-tag', releaseTag);

  build:
    name: Build release assets (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: prepare
    if: ${{ needs.prepare.outputs.should-release == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            archive: tar.gz
            binary-ext: ''
          - goos: linux
            goarch: arm64
            archive: tar.gz
            binary-ext: ''
          - goos: darwin
            goarch: amd64
            archive: tar.gz
            binary-ext: ''
          - goos: darwin
            goarch: arm64
            archive: tar.gz
            binary-ext: ''
          - goos: windows
            goarch: amd64
            archive: zip
            binary-ext: '.exe'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4.4.0

      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          go build -trimpath -o "dist/vokuknow${{ matrix.binary-ext }}" ./cmd/vokuknow

      - name: Package archive
        run: |
          asset="vokuknow_${{ matrix.goos }}_${{ matrix.goarch }}.${{ matrix.archive }}"
          staging=$(mktemp -d)
          cp "dist/vokuknow${{ matrix.binary-ext }}" "$staging/vokuknow${{ matrix.binary-ext }}"

          if [ "${{ matrix.archive }}" = "zip" ]; then
            (
              cd "$staging"
              zip -q -r "$GITHUB_WORKSPACE/dist/$asset" .
            )
          else
            tar -C "$staging" -czf "$GITHUB_WORKSPACE/dist/$asset" .
          fi

      - name: Upload release asset
        uses: actions/upload-artifact@v4.6.2
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/vokuknow_${{ matrix.goos }}_${{ matrix.goarch }}.${{ matrix.archive }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build
    if: ${{ needs.prepare.outputs.should-release == 'true' }}

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4.3.0
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum vokuknow_* > checksums.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.release-tag }}
          files: |
            dist/vokuknow_*
            dist/checksums.txt
          generate_release_notes: true
